<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel administrativo - Bitácora</title><link rel="stylesheet" href="admin.css?v=9"></head><body><main>
<h1>Bitácora de práctica supervisada<small>Panel de supervisión</small></h1><div id="msg" class="err"></div>
<form id="login" class="card hidden"><input id="em" type="email" placeholder="Correo" required>
<input id="pw" type="password" placeholder="Contraseña" required><button>Entrar</button></form>
<div id="app" class="hidden">
<div class="kpis" id="kpis"></div>
<div id="restbar" class="restbar hidden"></div>
<div id="pend" class="card pend hidden"></div>
<details id="rest" class="card restcard"><summary><h2 id="rest-sum">Días de descanso</h2></summary>
<p class="sub">Marque los días laborables en que no hay práctica. Ese día el estudiante no puede iniciar jornada y verá el aviso en su pantalla.</p>
<div id="rest-form"></div><div id="rest-list"></div></details>
<div class="charts"><div class="card"><h2>Bitácoras por día (últimos 14 días)</h2><div id="c-days"></div></div>
<div class="card"><h2>Bitácoras por grado</h2><div id="c-grade"></div></div></div>
<div class="bar"><input id="q" placeholder="Buscar estudiante o lugar…"><select id="g"><option value="">Todos los grados</option></select><select id="pg" title="Tipo de práctica"><option value="">Todos los tipos</option><option value="practica">Práctica Supervisada</option><option value="prepractica">Prepráctica</option><option value="none">Sin definir</option></select><select id="ac" title="Estado"><option value="">Activos e inactivos</option><option value="on">Solo activos</option><option value="off">Solo inactivos</option></select>
<button id="re" class="sec">Actualizar</button><a class="sec" href="mosaico.html" style="padding:8px 12px;text-decoration:none">Mosaico de videos</a><button id="out" class="sec">Salir</button></div>
<div id="list"></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=8"></script><script src="admin.js?v=8"></script></body></html>
