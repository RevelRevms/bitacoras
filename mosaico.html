<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mosaico de videos - Bitácora</title><link rel="stylesheet" href="mosaico.css?v=3"></head><body>
<p id="boot" class="boot">Verificando sesión…</p>
<form id="login" class="lg hidden"><h1>Mosaico de videos</h1><div id="msg" class="err"></div>
<input id="em" type="email" placeholder="Correo" required autocomplete="username"><input id="pw" type="password" placeholder="Contraseña" required autocomplete="current-password"><button>Entrar</button></form>
<div id="app" class="hidden">
<header class="bar"><b>Mosaico</b>
<label>Fecha <input id="d" type="date"></label>
<select id="g"><option value="">Todos los grados</option></select>
<input id="q" placeholder="Buscar estudiante…">
<select id="mode" title="Diseño"><option value="collage">Collage</option><option value="grid">Cuadrícula</option></select>
<select id="fit" title="Ajuste del video en el cuadro"><option value="fill">Llenar (zoom)</option><option value="contain">Completo (con franjas)</option></select>
<button id="sh" class="sec" type="button" title="Cambiar la disposición del collage">Mezclar</button>
<label class="sz">Tamaño <input id="sz" type="range" min="90" max="420" step="10" value="150"></label>
<button id="pp" class="sec" type="button">Pausar todo</button>
<button id="re" class="sec" type="button">Recargar</button>
<a href="admin.html" class="sec">Panel</a><button id="out" class="sec" type="button">Salir</button>
<span id="info"></span></header>
<div id="msg2" class="err"></div>
<div id="grid"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=7"></script><script src="mosaico.js?v=3"></script></body></html>
