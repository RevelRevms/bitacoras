<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mosaico de videos - Bitácora</title><link rel="stylesheet" href="mosaico.css?v=1"></head><body>
<form id="login" class="lg hidden"><h1>Mosaico de videos</h1><div id="msg" class="err"></div>
<input id="em" type="email" placeholder="Correo" required><input id="pw" type="password" placeholder="Contraseña" required><button>Entrar</button></form>
<div id="app" class="hidden">
<header class="bar"><b>Mosaico</b>
<label>Fecha <input id="d" type="date"></label>
<select id="g"><option value="">Todos los grados</option></select>
<input id="q" placeholder="Buscar estudiante…">
<label>Tamaño <select id="sz"><option value="160">Pequeño</option><option value="230" selected>Mediano</option><option value="340">Grande</option></select></label>
<button id="pp" class="sec" type="button">Pausar todo</button>
<button id="re" class="sec" type="button">Recargar</button>
<a href="admin.html" class="sec">Panel</a><button id="out" class="sec" type="button">Salir</button>
<span id="info"></span></header>
<div id="msg2" class="err"></div>
<div id="grid"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=7"></script><script src="mosaico.js?v=1"></script></body></html>
